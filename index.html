<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#145a43">
<script>(function(){var t=null;try{t=localStorage.getItem("fund-theme")}catch(e){}if(!t)t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
<title>صندوق السدحان الخيري</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f4;--bg2:#e9f0ec;--sf:#ffffff;--sf2:#f7faf8;--ink:#14201b;--mut:#5f6f68;--ln:#dfe7e2;
  --g:#145a43;--g2:#1f7a5a;--g3:#2fa37a;--au:#9c7a2a;--au2:#e2c77e;--bad:#b23b2e;--ok:#1f7a5a;
  --grad:linear-gradient(135deg,#0e3a2c 0%,#145a43 45%,#1f7a5a 100%);
  --gold:linear-gradient(135deg,#c9a24c,#e8cf86);
  --sh:0 1px 2px rgba(16,40,30,.06),0 8px 24px rgba(16,40,30,.07);--sh2:0 14px 40px rgba(16,40,30,.16);
  --r:16px;--soft-ok:#e2f2ea;--soft-bad:#fbe7e4;--soft-au:#f7efd9;
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#0b1411;--bg2:#0f1c17;--sf:#13221c;--sf2:#182a23;--ink:#e6efe9;--mut:#93a69d;--ln:#243a31;
  --g:#3fb489;--g2:#4fc79a;--g3:#7fe0bb;--au:#d9b860;--au2:#8a7337;--bad:#ff8a7a;--ok:#5fd3a5;
  --grad:linear-gradient(135deg,#0d2a20 0%,#11392b 50%,#175239 100%);
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--sh2:0 18px 44px rgba(0,0,0,.5);
  --soft-ok:#123227;--soft-bad:#3a1a16;--soft-au:#2b2414;color-scheme:dark
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.75 'IBM Plex Sans Arabic',Tahoma,sans-serif;
  background:radial-gradient(1200px 500px at 85% -10%,var(--bg2),transparent 60%),var(--bg);transition:background-color .3s,color .3s}
button,input,select{font:inherit;color:inherit}
a{color:var(--g2)}
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;padding:22px 18px 74px}
.hero:before{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(232,207,134,.28),transparent 65%)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.035) 46px 47px);pointer-events:none}
.top{max-width:960px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.logo{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(232,207,134,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.logo svg{width:30px;height:30px}
.brand{flex:1;min-width:0}
.brand small{display:block;color:var(--au2);font-size:12.5px;line-height:1.5;opacity:.95}
:root[data-theme="dark"] .brand small{color:#e2c77e}
.brand h1{font:700 25px/1.45 'Noto Kufi Arabic',sans-serif;margin:0 0 3px}
.tt{flex:none;width:44px;height:44px;border-radius:13px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s}
.tt:hover{background:rgba(255,255,255,.18)}.tt:active{transform:scale(.94)}.tt svg{width:21px;height:21px}
.tt .sun{display:none}:root[data-theme="dark"] .tt .sun{display:block}:root[data-theme="dark"] .tt .moon{display:none}
nav{max-width:960px;margin:-50px auto 0;padding:0 14px;position:relative;z-index:3}
nav .seg{display:flex;gap:4px;padding:5px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh2)}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;padding:11px 8px;border-radius:13px;cursor:pointer;color:var(--mut);font-weight:500;transition:background .2s,color .2s}
nav button svg{width:19px;height:19px;flex:none}
nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(20,90,67,.28)}
nav button:not(.on):hover{background:var(--sf2);color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:16px 14px 70px}
.pane{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:20px;min-height:340px;box-shadow:var(--sh);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2,h3{color:var(--ink)}
.lbl{color:var(--mut);font-size:14px}
.balc{position:relative;overflow:hidden;border-radius:20px;padding:22px;color:#fff;background:var(--grad);box-shadow:var(--sh2);margin-bottom:16px}
.balc:after{content:"";position:absolute;width:260px;height:260px;left:-80px;bottom:-140px;border-radius:50%;background:radial-gradient(circle,rgba(232,207,134,.35),transparent 65%)}
.balc .lbl{color:rgba(255,255,255,.78)}
.big{font:700 42px/1.3 'Noto Kufi Arabic',sans-serif;color:var(--g);font-variant-numeric:tabular-nums;letter-spacing:-.5px}.big span{font-size:17px;font-weight:500;color:var(--au)}
.balc .big{color:#fff}.balc .big span{color:#e8cf86}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
.chip{font-size:13px;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{border:1px solid var(--ln);border-radius:var(--r);padding:14px;background:var(--sf2);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi i{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;margin-bottom:8px;background:var(--soft-ok);color:var(--g2)}
.kpi i svg{width:19px;height:19px}.kpi.au i{background:var(--soft-au);color:var(--au)}
.kpi b{display:block;font:700 19px/1.5 'Noto Kufi Arabic',sans-serif;font-variant-numeric:tabular-nums}.kpi b small{font-size:12px;font-weight:500;color:var(--mut)}
.card{border:1px solid var(--ln);border-radius:var(--r);padding:16px;background:var(--sf2)}
.num{font:700 22px/1.5 'Noto Kufi Arabic',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:9px;background:var(--gold);overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut)}.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;background:var(--g2)}.leg span.a:before{background:var(--au)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px;font-weight:500}
input,select{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);transition:border-color .2s,box-shadow .2s;min-height:46px}
input:focus,select:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 4px color-mix(in srgb,var(--g2) 18%,transparent)}
input[type=file]{padding:9px;background:var(--sf2)}
button:focus-visible,a:focus-visible{outline:3px solid var(--au);outline-offset:2px}
.btn{background:var(--grad);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;font-weight:500;box-shadow:0 6px 16px rgba(20,90,67,.22);transition:transform .08s,box-shadow .2s,opacity .15s;min-height:44px}
.btn:hover{box-shadow:0 8px 22px rgba(20,90,67,.32)}.btn:active{transform:scale(.97)}
.btn.alt{background:var(--sf);color:var(--g2);border:1px solid color-mix(in srgb,var(--g2) 45%,var(--ln));box-shadow:none}
.btn.alt:hover{background:var(--soft-ok)}
.btn.sm{padding:6px 13px;font-size:14px;min-height:36px;border-radius:10px}
.btn.busy,.btn:disabled{opacity:.7;cursor:progress}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:8px;border:1px solid var(--ln);border-radius:14px;padding:4px 12px 12px;margin:10px 0;background:var(--sf2)}
.row .w2{grid-column:span 2}.row .w4{grid-column:1/-1}
.diff{padding:11px 14px;border-radius:12px;margin:12px 0;font-weight:500}
.diff.ok{background:var(--soft-ok);color:var(--ok)}.diff.no{background:var(--soft-bad);color:var(--bad)}
.msg{margin:10px 0;padding:11px 14px;border-radius:12px;background:var(--soft-bad);color:var(--bad)}.msg.good{background:var(--soft-ok);color:var(--ok)}
details{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--sf2);transition:box-shadow .2s}
details[open]{box-shadow:var(--sh)}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none}summary::-webkit-details-marker{display:none}
.tag{font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--soft-ok);color:var(--g2);white-space:nowrap;font-weight:500}
.tag.stok{background:var(--soft-ok);color:var(--ok)}.tag.stno{background:var(--soft-bad);color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;margin-top:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 10px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:top}
th{background:var(--sf2);color:var(--mut);font-weight:500;font-size:13.5px;white-space:nowrap}
td{white-space:nowrap}td:nth-child(3){white-space:normal;min-width:96px}td:nth-child(4){white-space:normal}
tr:last-child td{border-bottom:0}tbody tr:hover td,tr:hover td{background:color-mix(in srgb,var(--sf2) 60%,transparent)}
.sub{display:flex;gap:6px;margin:-4px -4px 16px;padding:4px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--mut);transition:.2s;white-space:nowrap}
.sub button:hover{color:var(--ink);border-color:var(--g2)}
.sub button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(20,90,67,.25)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 12px}.who #out{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--ln))}
.hid{display:none!important}
input.in{margin:4px 0}.irow{border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0;display:grid;gap:8px;background:var(--sf2)}
.rcpt{border:2px solid var(--g);border-radius:16px;padding:22px;margin-top:12px;background:var(--sf)}
.rh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--au);padding-bottom:10px;margin-bottom:10px}
.rf{font:700 22px/1.5 'Noto Kufi Arabic',sans-serif;color:var(--g)}.rn{text-align:center;border:1px solid var(--g);border-radius:12px;padding:6px 14px}.rn b{font:700 21px 'Noto Kufi Arabic',sans-serif}
.pbar{height:9px;border-radius:9px;background:var(--ln);overflow:hidden;display:flex;margin:4px 0 8px}.pbar i{background:var(--grad)}.pbar s{background:var(--gold)}
.ord{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--ln);padding:8px 0}a.btn{text-decoration:none;display:inline-flex;align-items:center}
body.loading:before{content:"";position:fixed;top:0;right:0;left:0;height:3px;z-index:99;background:linear-gradient(90deg,var(--au),var(--g3),var(--au));background-size:200% 100%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-200% 0}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;margin-inline-end:7px;vertical-align:-2px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--sf2),var(--ln),var(--sf2));background-size:200% 100%;animation:ld 1.2s linear infinite;margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--grad);color:#fff;padding:11px 22px;border-radius:99px;opacity:0;transition:.25s;z-index:100;box-shadow:var(--sh2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.mini>div{border:1px solid var(--ln);border-radius:12px;padding:8px 10px;background:var(--sf)}.mini span{display:block;font-size:12.5px;color:var(--mut)}
.mini b{font:700 15.5px/1.6 'Noto Kufi Arabic',sans-serif;font-variant-numeric:tabular-nums}.mini .au{background:var(--soft-au);border-color:transparent}.mini .ok{background:var(--soft-ok);border-color:transparent}.mini .ok b{color:var(--ok)}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dnw{position:relative;width:150px;height:150px;flex:none;margin:0 auto}.dnw svg{width:100%;height:100%;overflow:visible}
.arc{animation:dn 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes dn{from{stroke-dasharray:0 999}}
.dnc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dnc b{font:700 26px/1.2 'Noto Kufi Arabic',sans-serif;color:var(--au)}.dnc span{font-size:12.5px;color:var(--mut)}
.dnl{flex:1;min-width:210px}.dnl>b{font:600 16px 'Noto Kufi Arabic',sans-serif}
.dli{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.dli i{width:11px;height:11px;border-radius:4px;flex:none}.dli span{flex:1;color:var(--mut)}.dli b{font:600 14.5px 'Noto Kufi Arabic',sans-serif;font-variant-numeric:tabular-nums}
.dli em{font-style:normal;font-size:12.5px;color:var(--mut);min-width:36px;text-align:left}.dli.tot{border:0;padding-top:8px}.dli.tot span{color:var(--ink);font-weight:600}
.wrap td{white-space:normal}.wrap td:last-child{white-space:nowrap;text-align:left;width:1%}.sumrow td{font-weight:700;background:var(--soft-ok)}
.amt{white-space:nowrap;flex:none}.hd{white-space:nowrap}
.rng{display:flex;flex-wrap:wrap;gap:2px 14px}.rng small{color:var(--mut);font-size:12.5px}
.mini.m2{grid-template-columns:1fr 1fr}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}.btnrow .btn{padding-inline:10px}
.z{opacity:.45}.leg span.z:before{background:var(--ln)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.drop{position:relative;display:grid;justify-items:center;text-align:center;gap:6px;padding:26px 16px;margin:0 0 12px;border:2px dashed color-mix(in srgb,var(--g2) 40%,var(--ln));border-radius:18px;background:var(--sf2);cursor:pointer;transition:.2s}
.drop svg{width:44px;height:44px;color:var(--g2)}.drop b{font:600 16px 'Noto Kufi Arabic',sans-serif;color:var(--ink);word-break:break-all}.drop .lbl{max-width:420px}
.drop:hover,.drop.over{border-color:var(--g2);background:var(--soft-ok)}.drop.has{border-style:solid;border-color:var(--g2)}
.drop:focus-within{outline:3px solid var(--au);outline-offset:2px}.drop.busy{opacity:.6;pointer-events:none}
.recon{display:grid;gap:2px;padding:12px 14px;border-radius:14px;margin-bottom:12px;background:var(--soft-au);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb,var(--au) 40%,transparent)}
.recon b{color:var(--au)}.recon.ok{background:var(--soft-ok);color:var(--ok);border-color:transparent;display:block}
dialog.dlg{border:0;border-radius:20px;padding:22px;max-width:min(420px,92vw);background:var(--sf);color:var(--ink);box-shadow:var(--sh2)}
dialog.dlg::backdrop{background:rgba(5,20,15,.55);backdrop-filter:blur(2px)}dialog.dlg h3{margin:0 0 6px;font:600 18px 'Noto Kufi Arabic',sans-serif}dialog.dlg p{margin:0;color:var(--mut)}
.btn.dng{background:var(--bad);box-shadow:none}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:18px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:600px){th,td{padding:9px 7px;font-size:14px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.big{font-size:36px}.brand h1{font-size:21px}.kpi b{font-size:17px}.brand small{font-size:11.5px}
  .pane{padding:16px;border-radius:18px}nav button{flex-direction:column;gap:2px;font-size:13px;padding:8px 4px}.hero{padding-bottom:70px}}
@media print{.hero,nav,.noprint,.foot{display:none!important}.pane{border:0;box-shadow:none;animation:none}body{background:#fff}.tw{overflow:visible;border:0}table{font-size:12.5px}th,td{white-space:normal;padding:6px}tr,.mini,.card,.rcpt{break-inside:avoid}h3{break-after:avoid}thead{display:table-header-group}}

#abar,#side,#bnav,#fab{display:none}
nav[aria-label="الأقسام"]{display:none}
body:not(.admin) main{max-width:460px;margin-top:-54px;position:relative;z-index:3}
.lgi{display:flex;align-items:center;gap:10px;margin-bottom:6px}.lgi svg{width:26px;height:26px;color:var(--g);flex:none}
.rft{margin-top:22px;padding-top:10px;border-top:1px dashed var(--ln);font-size:12.5px;color:var(--mut);line-height:1.9;text-align:center}.rft b{color:var(--ink);font-weight:600}
.rthx{margin-top:26px;text-align:center;font:600 16px/1.6 'Noto Kufi Arabic',sans-serif;color:var(--g)}
.pb{break-after:page;page-break-after:always}.pb:last-child{break-after:auto;page-break-after:auto}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pchips button{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}.pchips button.on{background:var(--grad);color:#fff;border-color:transparent}
.ycard{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}.ycard>div{flex:1;min-width:140px}
.wyr{display:flex;align-items:center;gap:10px;margin:8px 0 0}.wyr label{margin:0;white-space:nowrap}.wyr select{flex:1}
.urow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)}.urow.off>span:first-child{opacity:.55}
body.admin .hero,body.admin .foot{display:none}
body.admin #abar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(10,40,30,.18)}
.ab-t{min-width:0;display:grid}.ab-t b{font:700 16px/1.4 'Noto Kufi Arabic',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ab-t span{font-size:13px;color:#e8cf86}
.ab-a{display:flex;gap:8px;flex:none}
.ib{width:44px;height:44px;border-radius:13px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s,transform .1s}
.ib:hover{background:rgba(255,255,255,.2)}.ib:active{transform:scale(.94)}.ib svg{width:21px;height:21px}.ib.lo{color:#ffd2cb}
.ib .sun{display:none}:root[data-theme="dark"] .ib .sun{display:block}:root[data-theme="dark"] .ib .moon{display:none}
body.admin main{padding-bottom:calc(140px + env(safe-area-inset-bottom));padding-top:14px}

  const first = yy => { let d = new Date(Date.UTC(622, 6, 19) + Math.round((yy - 1) * 354.36707 * 864e5) - 25 * 864e5);
    for (let i = 0; i < 60; i++, d = new Date(d.getTime() + 864e5)) { const [Y, M, D] = parts(d); if (Y === yy && M === 1 && D === 1) return d; } return null; };

let OPY = null, OPF = '';
async function ops() {
  OPY = OPY || hijri(today()).split('-')[2]; const adm = me.role === 'admin';
  const r = await call('listSpending', { year: OPY }), items = r.list;
  const ST = { 'معتمد': 'بانتظار الكشف', 'حُوِّل': 'بانتظار الكشف', 'مطابق': 'مطابق للكشف', 'ملغى': 'ملغى' };
  const live = items.filter(x => x.status === 'مطابق'), sum = f => live.filter(f).reduce((a, x) => a + x.amount, 0);
  const z = sum(x => x.grp === 'ben' && x.cat === 'زكاة'), sd = sum(x => x.grp === 'ben' && x.cat === 'صدقة'), op = sum(x => x.grp === 'op'), byCat = {};
  live.filter(x => x.grp === 'op').forEach(x => { byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
  const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
  const F = { '': ['الكل', () => true], ben: ['المستفيدون', x => x.grp === 'ben'], op: ['الإدارية', x => x.grp === 'op'] };
  cats.forEach(c => { F['c:' + c] = [c, x => x.grp === 'op' && x.cat === c]; }); if (!F[OPF]) OPF = '';
  const shown = items.filter(F[OPF][1]), open = items.filter(x => x.status === 'معتمد' || x.status === 'حُوِّل').length;
  $('#sv').innerHTML = '<div class="ybar"><div class="yfld"><label for="oy">السنة</label><select id="oy" aria-label="السنة الهجرية">' + ySel(OPY) + '</select></div></div>' +
    '<p class="lbl" style="margin:10px 0 0">كل ما صُرف في السنة حسب تاريخ الحوالة. التسجيل يتم من «استيراد كشف» بعد التحويل، فيصدر سند الصرف تلقائيًا.</p>' +
    '<div class="mini" style="margin:14px 0"><div class="ok"><span>للمستفيدين — زكاة</span><b>' + nf(z) + '</b></div><div class="ok"><span>للمستفيدين — صدقة</span><b>' + nf(sd) + '</b></div>' +
    '<div class="au"><span>مصروفات إدارية</span><b>' + nf(op) + '</b></div><div><span>إجمالي الصرف ' + esc(OPY) + 'هـ</span><b>' + nf(z + sd + op) + '</b></div>' + (open ? '<div><span>سندات بانتظار الكشف</span><b>' + open + '</b></div>' : '') + '</div>' +
    (cats.length && (OPF === 'op' || OPF.indexOf('c:') === 0) ? '<div class="tw"><table class="wrap"><tr><th>البند الإداري</th><th>المبلغ</th></tr>' + cats.map(c => '<tr><td>' + esc(c) + '</td><td>' + nf(byCat[c]) + '</td></tr>').join('') + '<tr class="sumrow"><td>المجموع</td><td>' + nf(op) + '</td></tr></table></div>' : '') +
    '<div class="pchips">' + Object.keys(F).map(k => '<button type="button" data-cf="' + esc(k) + '"' + (OPF === k ? ' class="on"' : '') + '>' + esc(F[k][0]) + '</button>').join('') + '</div><div id="fm"></div>' +
    (shown.length ? '<p class="lbl" style="margin:4px 0 8px">' + shown.length + ' عملية — ' + R(shown.filter(x => x.status === 'مطابق').reduce((a, x) => a + x.amount, 0)) + '</p>' +
      shown.map((x, i) => '<div class="card" style="margin-bottom:10px" data-i="' + items.indexOf(x) + '"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(x.name) + '</b><span class="tag' + (x.grp === 'ben' ? ' stok' : '') + '">' + esc(x.grp === 'ben' ? x.cat + ' — مستفيد' : x.cat) + '</span></div>' +
      '<div class="lbl">' + hTxt(x.hijri || hijri(x.date)) + ' — ' + gTxt(x.date) + (x.note ? ' — ' + esc(x.note) : '') + (x.alloc && x.alloc !== String(OPY) ? ' <span class="tag">من محجوز ' + esc(x.alloc) + 'هـ</span>' : '') + '</div>' +
      '<div class="ord"><span>' + (x.num ? 'سند صرف <b>' + x.num + '</b> — ' : '') + R(x.amount) + ' <span class="tag st' + (x.status === 'مطابق' ? 'ok' : x.status === 'ملغى' ? 'no' : '') + '">' + esc(ST[x.status] || x.status) + '</span></span><span>' +
      (x.oid ? '<button class="btn alt sm" data-act="vo">عرض</button>' : '') +
      (adm && !x.pid && (x.status === 'معتمد' || x.status === 'حُوِّل') ? ' <button class="btn alt sm" data-act="cx">إلغاء</button>' : '') +

      : '<p class="lbl">لا يوجد صرف في هذه السنة' + (OPF ? ' ضمن هذا التصنيف' : '') + '.</p>');
  $('#oy').onchange = () => { OPY = $('#oy').value; ops().catch(e => $('#sv').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'); };

    const cf = e.target.dataset.cf; if (cf !== undefined) { OPF = cf; ops().catch(fail); return; }

  };
}

}
function cancelForm(o, after) {
  form('<h3 style="font-family:Noto Kufi Arabic,sans-serif;font-weight:600;font-size:17px;margin:0">إلغاء سند الصرف ' + o.num + '</h3><div class="lbl">يبقى رقم السند مسجّلًا بحالة «ملغى»، ويعود المبلغ إلى المتاح.</div><label>سبب الإلغاء</label><input id="cr">',
    () => call('cancelOrder', { id: o.id, reason: $('#cr').value }), after);
}
function vchHtml(v, fund) {
  return '<div class="rcpt"><div class="rh"><div><div class="rf">' + esc(fund) + '</div><div class="lbl">' + ORG + '</div></div>' +
    '<div class="rn">سند صرف<br><b>' + esc(v.num) + '</b></div></div>' +
    (v.status === 'ملغى' ? '<div class="msg"><b>هذا السند ملغى</b></div>' : '') +
    '<p>التاريخ: ' + hTxt(v.hijri || hijri(v.date)) + ' — الموافق ' + gTxt(v.date) + ' م</p>' +
    (v.type === 'تشغيلي' ? '<p>يُصرف إلى الجهة: <b>' + esc(v.beneficiary) + '</b> — البند: ' + esc(v.cat) + (v.account ? '<br>حساب: <bdi dir="ltr">' + esc(v.account) + '</bdi>' : '') + '</p>' :
      '<p>يُصرف إلى المستفيد: <b>' + esc(v.beneficiary) + '</b><br>المستلم: <b>' + esc(v.recipient || '—') + '</b>' + (v.account ? ' — حساب: <bdi dir="ltr">' + esc(v.account) + '</bdi>' : '') + (v.bank ? ' — ' + esc(v.bank) : '') + '</p>') +
    '<p>مبلغًا وقدره: <b>' + R(v.amount) + '</b><br><span class="lbl">فقط ' + tafqeet(Number(v.amount)) + ' لا غير</span></p>' +
    '<div class="tw"><table><tr><th>النوع</th><th>السنة</th><th>المرحلة</th><th>الموافقة من</th></tr><tr><td>' + esc(v.type) + '</td><td>' + esc(v.year) + ' هـ</td><td>' + esc(v.stage || '—') + '</td><td>' + esc(v.approver || '—') + '</td></tr></table></div>' +
    (v.note ? '<p>البيان: ' + esc(v.note) + '</p>' : '') + '</div>';
}
async function voucher(id, back) {
  const v = await call('getVoucher', { id: id });
  $('#sv').onclick = null;
  $('#sv').innerHTML = '<div class="noprint"><button class="btn" id="rpr">طباعة / حفظ PDF</button> <button class="btn alt" id="rbk">رجوع</button></div>' + vchHtml(v, v.fund);
  $('#rpr').onclick = () => printBlock($('.rcpt').outerHTML, 'سند صرف ' + v.num); $('#rbk').onclick = () => back ? sub('ops') : sub(v.type === 'تشغيلي' ? 'ops' : 'ben');
}
go();
</script>
</body>
